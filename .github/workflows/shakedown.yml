# Shakedown tests its own demo store on every pull request: the four customers from hell that
# need no AI, against Leaky Llama exactly as it ships (apps/leaky-llama/lib/shipped-mode.ts).
# Everything runs in the PayPal sandbox. The scoreboard lands on the pull request as one comment
# that each push updates, posted with this workflow's own token; no third-party action sees it.
name: Shakedown

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shakedown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shakedown:
    name: Customers from hell
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      PAYPAL_ENV: sandbox
      # Sandbox credentials, as repository secrets. Without them (a fork's pull request, say) the
      # checkout customers are skipped and the Echo still runs.
      PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Leaky Llama and the CLI
        run: pnpm turbo run build --filter=@shakedown/leaky-llama --filter=@shakedown-dev/cli

      - name: Make a probe secret for this run
        run: |
          secret="$(openssl rand -hex 24)"
          echo "::add-mask::$secret"
          echo "SHAKEDOWN_PROBE_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Start Leaky Llama as shipped
        working-directory: apps/leaky-llama
        run: |
          STORE_DATA_DIR="$RUNNER_TEMP/pglite" nohup pnpm exec next start --port 3100 > "$RUNNER_TEMP/store.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3100/api/catalog > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/store.log"
          exit 1

      - name: Send in the customers from hell
        id: shakedown
        run: |
          set +e
          node packages/cli/dist/index.js run --ci
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"

      - name: Add the scoreboard to the job summary
        if: always() && hashFiles('.shakedown/comment.md') != ''
        run: cat .shakedown/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post the scoreboard on the pull request
        # A fork's pull request gets a read-only token, so it only gets the job summary.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('.shakedown/report.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node packages/cli/dist/index.js comment

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shakedown-report
          path: .shakedown/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Pass or fail on the verdict
        env:
          VERDICT: ${{ steps.shakedown.outputs.exit-code }}
        run: |
          case "$VERDICT" in
            0) echo "Sealed: no leaks." ;;
            1) echo "::error::Shakedown found leaks. See the scoreboard on the pull request." ;;
            *) echo "::error::Shakedown could not finish (exit code $VERDICT)." ;;
          esac
          exit "${VERDICT:-4}"
