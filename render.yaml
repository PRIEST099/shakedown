# Shakedown's hosted demo on Render: the site and console, Leaky Llama (the demo store), the
# Render Workflows service that runs each campaign, and the console's Postgres. Sandbox only.
#
# This file is the dev environment and deploys from main. render.judge.yaml is the frozen copy
# for judging. docs/DEPLOY.md walks through both, including every secret you type in yourself.

envVarGroups:
  - name: shakedown-sandbox
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAYPAL_ENV
        value: sandbox
      # The PayPal sandbox app's keys are on each service below, not here: Render never prompts
      # for a secret inside a group (blueprint-spec, "Prompting for secret values").
      # Shared by the store and whatever tests it: signs campaign tokens, opens the probe API.
      - key: SHAKEDOWN_PROBE_SECRET
        generateValue: true
      # The store serves it at /.well-known/shakedown.txt; the runners check it before testing the
      # store, whose private-network name Shakedown can't tell is private on its own.
      - key: SHAKEDOWN_VERIFICATION_TOKEN
        generateValue: true

services:
  - type: web
    name: shakedown-web
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: commit
    # Render's own pnpm sits in a read-only folder, so the pinned pnpm runs through npx. The
    # install takes only this service's slice of the workspace, plus the root for TypeScript:
    # none of apps/video's tooling.
    buildCommand: 'npx --yes pnpm@12.8.1 install --frozen-lockfile --filter "@shakedown/web..." --filter "{.}" && npx --yes pnpm@12.8.1 --filter @shakedown/web build'
    startCommand: cd apps/web && ./node_modules/.bin/next start --port $PORT
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
      ignoredPaths:
        - "**/*.test.ts"
        - "**/*.md"
    envVars:
      - fromGroup: shakedown-sandbox
      # Your PayPal sandbox app, typed in when the Blueprint is created. Never committed.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CONSOLE_DATABASE_URL
        fromDatabase:
          name: shakedown-db
          property: connectionString
      # The store, over Render's private network.
      - key: LEAKY_LLAMA_HOSTPORT
        fromService:
          name: shakedown-store
          type: web
          property: hostport
      # Live runs go to Render Workflows. The key comes from a Render user that belongs only to
      # this workspace: Render API keys reach every workspace their owner is in.
      - key: SHAKEDOWN_WORKFLOW
        fromService:
          name: shakedown-runs
          type: workflow
          property: slug
      - key: RENDER_API_KEY
        sync: false
      # Hosted for judges: per-visitor limits, a few runs at once, a daily ceiling.
      - key: SHAKEDOWN_JUDGE_MODE
        value: "1"
      # Triage, the console's agent. Optional; its spend is capped and kept in Postgres.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: SHAKEDOWN_CONSOLE_AI_BUDGET_USD
        value: "0.25"
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE_KEY
        sync: false

  - type: web
    name: shakedown-store
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: commit
    # Render's own pnpm sits in a read-only folder, so the pinned pnpm runs through npx. The
    # install takes only this service's slice of the workspace, plus the root for TypeScript:
    # none of apps/video's tooling.
    buildCommand: 'npx --yes pnpm@12.8.1 install --frozen-lockfile --filter "@shakedown/leaky-llama..." --filter "{.}" && npx --yes pnpm@12.8.1 --filter @shakedown/leaky-llama build'
    startCommand: cd apps/leaky-llama && ./node_modules/.bin/next start --port $PORT
    healthCheckPath: /api/health
    # The store keeps Lulu's spend log on its own disk; its orders are in Postgres.
    disk:
      name: store-data
      mountPath: /var/data
      sizeGB: 1
    buildFilter:
      paths:
        - apps/leaky-llama/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
      ignoredPaths:
        - "**/*.test.ts"
        - "**/*.md"
    envVars:
      - fromGroup: shakedown-sandbox
      # Your PayPal sandbox app, typed in when the Blueprint is created. Never committed.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Public for judges: checkouts, test deliveries and chat are limited per visitor.
      - key: SHAKEDOWN_JUDGE_MODE
        value: "1"
      # The store's orders live in Render Postgres, in a database of their own (leaky_llama)
      # that the store creates in the console's instance on first start. PGlite, the
      # in-process Postgres used locally, needs about 900 MB: more than a Starter instance has.
      - key: STORE_DATABASE_URL
        fromDatabase:
          name: shakedown-db
          property: connectionString
      - key: STORE_DATABASE_NAME
        value: leaky_llama
      # Lulu's spend log stays on the disk.
      - key: SHAKEDOWN_DATA_DIR
        value: /var/data/shakedown
      # Lulu, the store's support assistant. Optional; capped like every Claude call.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: SHAKEDOWN_AI_BUDGET_USD
        value: "0.50"
      - key: LULU_MODEL
        value: claude-haiku-4-5

  - type: workflow
    name: shakedown-runs
    runtime: node
    region: oregon
    branch: main
    autoDeployTrigger: commit
    # Render's own pnpm sits in a read-only folder, so the pinned pnpm runs through npx. The
    # install takes only this service's slice of the workspace, plus the root for TypeScript:
    # none of apps/video's tooling.
    buildCommand: 'npx --yes pnpm@12.8.1 install --frozen-lockfile --filter "@shakedown/workflows..." --filter "{.}" && npx --yes pnpm@12.8.1 --filter @shakedown/workflows build'
    startCommand: node apps/workflows/dist/index.js
    buildFilter:
      paths:
        - apps/workflows/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
      ignoredPaths:
        - "**/*.test.ts"
        - "**/*.md"
    envVars:
      - fromGroup: shakedown-sandbox
      # Your PayPal sandbox app, typed in when the Blueprint is created. Never committed.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CONSOLE_DATABASE_URL
        fromDatabase:
          name: shakedown-db
          property: connectionString
      - key: LEAKY_LLAMA_HOSTPORT
        fromService:
          name: shakedown-store
          type: web
          property: hostport

databases:
  - name: shakedown-db
    plan: basic-256mb
    # 1 GB is plenty for the console's runs; left out, Basic databases get 15 GB, and a disk can
    # grow later but never shrink.
    diskSizeGB: 1
    region: oregon
    databaseName: shakedown
    user: shakedown
    # Private network only: no address outside Render can connect.
    ipAllowList: []
