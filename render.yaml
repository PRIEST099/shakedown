# Shakedown's hosted demo on Render: the site and console, Leaky Llama (the demo store), the
# Render Workflows service that runs each campaign, and the console's Postgres. Sandbox only.
#
# This file is the dev environment and deploys from main. render.judge.yaml is the frozen copy
# for judging. docs/DEPLOY.md walks through both, including every secret you type in yourself.

envVarGroups:
  - name: shakedown-sandbox
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PAYPAL_ENV
        value: sandbox
      # Your PayPal sandbox app. Typed into the Render Dashboard, never committed.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Shared by the store and whatever tests it: signs campaign tokens, opens the probe API.
      - key: SHAKEDOWN_PROBE_SECRET
        generateValue: true

services:
  - type: web
    name: shakedown-web
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install -g pnpm@12.8.1 && pnpm install --frozen-lockfile && pnpm --filter @shakedown/web build
    startCommand: cd apps/web && ./node_modules/.bin/next start --port $PORT
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
      ignoredPaths:
        - "**/*.test.ts"
        - "**/*.md"
    envVars:
      - fromGroup: shakedown-sandbox
      - key: CONSOLE_DATABASE_URL
        fromDatabase:
          name: shakedown-db
          property: connectionString
      # The store, over Render's private network.
      - key: LEAKY_LLAMA_HOSTPORT
        fromService:
          name: shakedown-store
          type: web
          property: hostport
      # Live runs go to Render Workflows. The key comes from a Render user that belongs only to
      # this workspace: Render API keys reach every workspace their owner is in.
      - key: SHAKEDOWN_WORKFLOW
        fromService:
          name: shakedown-runs
          type: workflow
          property: slug
      - key: RENDER_API_KEY
        sync: false
      # Hosted for judges: per-visitor limits, a few runs at once, a daily ceiling.
      - key: SHAKEDOWN_JUDGE_MODE
        value: "1"
      # Triage, the console's agent. Optional; its spend is capped and kept in Postgres.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: SHAKEDOWN_CONSOLE_AI_BUDGET_USD
        value: "0.25"
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE_KEY
        sync: false

  - type: web
    name: shakedown-store
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install -g pnpm@12.8.1 && pnpm install --frozen-lockfile && pnpm --filter @shakedown/leaky-llama build
    startCommand: cd apps/leaky-llama && ./node_modules/.bin/next start --port $PORT
    healthCheckPath: /api/health
    # The store keeps its orders, and Lulu's spend log, on its own disk.
    disk:
      name: store-data
      mountPath: /var/data
      sizeGB: 1
    buildFilter:
      paths:
        - apps/leaky-llama/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
      ignoredPaths:
        - "**/*.test.ts"
        - "**/*.md"
    envVars:
      - fromGroup: shakedown-sandbox
      # Public for judges: checkouts, test deliveries and chat are limited per visitor.
      - key: SHAKEDOWN_JUDGE_MODE
        value: "1"
      - key: STORE_DATA_DIR
        value: /var/data/pglite
      - key: SHAKEDOWN_DATA_DIR
        value: /var/data/shakedown
      # Lulu, the store's support assistant. Optional; capped like every Claude call.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: SHAKEDOWN_AI_BUDGET_USD
        value: "0.50"
      - key: LULU_MODEL
        value: claude-haiku-4-5

  - type: workflow
    name: shakedown-runs
    runtime: node
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install -g pnpm@12.8.1 && pnpm install --frozen-lockfile && pnpm --filter @shakedown/workflows build
    startCommand: node apps/workflows/dist/index.js
    buildFilter:
      paths:
        - apps/workflows/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
      ignoredPaths:
        - "**/*.test.ts"
        - "**/*.md"
    envVars:
      - fromGroup: shakedown-sandbox
      - key: CONSOLE_DATABASE_URL
        fromDatabase:
          name: shakedown-db
          property: connectionString
      - key: LEAKY_LLAMA_HOSTPORT
        fromService:
          name: shakedown-store
          type: web
          property: hostport

databases:
  - name: shakedown-db
    plan: basic-256mb
    region: oregon
    databaseName: shakedown
    user: shakedown
    # Private network only: no address outside Render can connect.
    ipAllowList: []
