services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: shakedown
      POSTGRES_PASSWORD: shakedown
      POSTGRES_DB: shakedown
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shakedown"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
